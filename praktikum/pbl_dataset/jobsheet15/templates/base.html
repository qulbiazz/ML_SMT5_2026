<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Klarifikasi Hoaks Komdigi{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #155eef; }
    .topbar { background: #123b70; color: white; padding: 1.15rem max(1rem, calc((100% - 1080px) / 2)); }
    .topbar-inner { width: min(1080px, 100%); margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .topbar a { color: inherit; text-decoration: none; font-weight: 700; font-size: 1.05rem; }
    .topbar nav { display: flex; flex-wrap: wrap; gap: 1rem; }
    .topbar nav a { font-size: .95rem; }
    main { width: min(1080px, calc(100% - 2rem)); margin: 2rem auto; }
    .intro, .panel, .article-card, .article-detail { background: white; border: 1px solid #e1e7f0; border-radius: 12px; }
    .intro { padding: 1.5rem; margin-bottom: 1rem; }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.5rem, 3vw, 2rem); }
    .muted, .meta { color: #5d687b; }
    .stats { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
    .stat, .badge { display: inline-block; border-radius: 999px; padding: .3rem .7rem; background: #edf4ff; color: #174a87; font-size: .88rem; }
    .panel { padding: 1rem; margin-bottom: 1rem; }
    .classifier-panel { margin: 1rem 0 1.5rem; }
    .classifier-form { display: grid; gap: .75rem; }
    .classifier-form textarea { width: 100%; min-height: 170px; resize: vertical; font: inherit; padding: .7rem .8rem; border: 1px solid #cbd4e1; border-radius: 8px; }
    .classifier-form input:focus, .classifier-form textarea:focus { outline: 2px solid #8bb5ff; border-color: #155eef; }
    .result { border-left: 4px solid #155eef; }
    .result-hoax { border-left-color: #c62828; }
    .result-valid { border-left-color: #218739; }
    .error { color: #a11b1b; }
    .filters { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(180px, 260px) auto; gap: .65rem; }
    input, select, button { font: inherit; padding: .7rem .8rem; border: 1px solid #cbd4e1; border-radius: 8px; background: white; }
    button { background: #155eef; color: white; border-color: #155eef; cursor: pointer; font-weight: 600; }
    .article-list { display: grid; gap: .8rem; }
    .article-card { padding: 1rem 1.15rem; }
    .article-card h2 { font-size: 1.1rem; margin: .55rem 0; }
    .article-card h2 a { text-decoration: none; }
    .article-card p { margin: .4rem 0; line-height: 1.6; }
    .meta { font-size: .9rem; }
    .pagination { display: flex; align-items: center; justify-content: center; gap: 1rem; padding: 1.3rem 0; }
    .pagination a { text-decoration: none; }
    .article-detail { padding: clamp(1rem, 4vw, 2rem); }
    .article-detail h1 { margin: .8rem 0; line-height: 1.3; }
    .article-body { white-space: pre-line; line-height: 1.8; overflow-wrap: anywhere; }
    .back-link { display: inline-block; margin-bottom: 1rem; text-decoration: none; }
    .empty { text-align: center; padding: 2rem; }
    footer { text-align: center; color: #687386; font-size: .9rem; padding: 1rem; }
    @media (max-width: 650px) { .filters { grid-template-columns: 1fr; } main { margin-top: 1rem; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="{{ url_for('index') }}">PBL · Klasifikasi Berita</a>
      <nav aria-label="Navigasi utama">
        <a href="{{ url_for('classify_news') }}">Klasifikasi</a>
        <a href="{{ url_for('index') }}">Arsip Komdigi</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Arsip bersumber dari komdigi_hoaks.csv. Model dilatih dengan datasetUMPOHoax.csv; hasilnya bukan verifikasi fakta.</footer>
</body>
</html>
